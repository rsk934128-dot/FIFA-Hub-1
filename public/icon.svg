<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="3" />

  <!-- Tactical Pitch Lines Ambient -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(245, 158, 11, 0.08)" stroke-width="2" stroke-dasharray="8 6" />
  <line x1="80" y1="256" x2="432" y2="256" stroke="rgba(245, 158, 11, 0.1)" stroke-width="2" />

  <!-- Shield Shape -->
  <path d="M256 90 L380 145 C380 270 256 385 256 410 C256 385 132 270 132 145 Z" fill="rgba(11, 19, 41, 0.85)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- Inner Football Geometry -->
  <circle cx="256" cy="225" r="54" fill="url(#goldGrad)" />
  
  <!-- Football Pentagons -->
  <polygon points="256,192 279,209 270,237 242,237 233,209" fill="#050811" />
  <line x1="256" y1="192" x2="256" y2="171" stroke="#050811" stroke-width="4" />
  <line x1="279" y1="209" x2="299" y2="198" stroke="#050811" stroke-width="4" />
  <line x1="270" y1="237" x2="284" y2="256" stroke="#050811" stroke-width="4" />
  <line x1="242" y1="237" x2="228" y2="256" stroke="#050811" stroke-width="4" />
  <line x1="233" y1="209" x2="213" y2="198" stroke="#050811" stroke-width="4" />

  <!-- Live Pulse Dot -->
  <circle cx="370" cy="115" r="14" fill="url(#emeraldGrad)" />
  <circle cx="370" cy="115" r="22" fill="none" stroke="#34d399" stroke-width="3" opacity="0.6" />

  <!-- Text Label -->
  <text x="256" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" font-style="italic" letter-spacing="4" fill="url(#goldGrad)" text-anchor="middle">FIFA HUB</text>
  <text x="256" y="370" font-family="monospace" font-size="14" font-weight="700" letter-spacing="3" fill="#94a3b8" text-anchor="middle">LIVE TACTICS</text>
</svg>
